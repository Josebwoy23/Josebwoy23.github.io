






<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube - Watch</title>
<style>
  :root {
    --bg: #0f0f0f; --card: #181818; --text: #f1f1f1; --muted: #aaaaaa; --red: #ff0000;
  }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); }
  
  header { position: sticky; top: 0; height: 56px; background: var(--bg); display: flex; align-items: center; padding: 0 16px; z-index: 1000; border-bottom: 1px solid #222; }
.logo { font-size: 20px; font-weight: bold; cursor: pointer; }
.logo span { color: var(--red); }
  
.container { display: flex; gap: 24px; padding: 24px; max-width: 1700px; margin: auto; }
.main-content { flex: 1; }
.sidebar { width: 402px; }

  /* VIDEO PLAYER */
  #player { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }

  /* VIDEO INFO */
.video-title { font-size: 20px; font-weight: 600; margin: 12px 0; line-height: 1.4; }
.video-meta { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #303030; flex-wrap: wrap; gap: 8px; }
.views-date { color: var(--muted); font-size: 14px; }
.actions { display: flex; gap: 8px; }
.action-btn { background: #272727; border: none; color: var(--text); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
.action-btn:hover { background: #3d3d3d; }

  /* CHANNEL INFO */
.channel-info { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #303030; }
.channel-left { display: flex; align-items: center; gap: 12px; }
.channel-icon { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, #ff0000, #ff6600); flex-shrink: 0; }
.channel-name { font-weight: 500; font-size: 16px; }
.subscribers { font-size: 12px; color: var(--muted); }
.subscribe-btn { background: var(--red); color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
.subscribe-btn:hover { background: #cc0000; }

  /* DESCRIPTION */
.description { background: #272727; padding: 12px 16px; border-radius: 12px; margin: 12px 0; font-size: 14px; line-height: 1.6; white-space: pre-line; }

  /* UP NEXT SIDEBAR */
.sidebar h3 { margin-bottom: 16px; font-size: 18px; }
.up-next-item { display: flex; gap: 8px; margin-bottom: 12px; cursor: pointer; padding: 4px; border-radius: 8px; }
.up-next-item:hover { background: #272727; }
.up-next-thumb { width: 168px; aspect-ratio: 16/9; border-radius: 8px; background: #333; flex-shrink: 0; position: relative; }
.up-next-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); padding: 2px 4px; border-radius: 4px; font-size: 12px; }
.up-next-info h4 { font-size: 14px; margin-bottom: 4px; font-weight: 500; }
.up-next-info p { font-size: 12px; color: var(--muted); }

  @media(max-width: 1200px) {
  .container { flex-direction: column; }
  .sidebar { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="window.location='index.html'">▶️ <span>JB</span>PODCAST</div>
</header>

<div class="container">
  <!-- MAIN VIDEO -->
  <div class="main-content">
    <div id="player"></div>

    <h1 class="video-title" id="videoTitle">Loading...</h1>
    
    <div class="video-meta">
      <span class="views-date" id="videoMeta">Loading...</span>
      <div class="actions">
        <button class="action-btn">👍 Like</button>
        <button class="action-btn">👎</button>
        <button class="action-btn">↗️ Share</button>
        <button class="action-btn">➕ Save</button>
      </div>
    </div>

    <div class="description" id="videoDesc">Loading description...</div>
  </div>

  <!-- UP NEXT SIDEBAR -->
  <div class="sidebar">
    <h3>Up next</h3>
    
    <div class="up-next-item" onclick="window.location='watch.html?v=3L47O1AwSZ8'">
      <div class="up-next-thumb">
        <img src="https://i.ytimg.com/vi/3L47O1AwSZ8/mqdefault.jpg" alt="">
        <span class="duration">1hr:11:24</span>
      </div>
      <div class="up-next-info">
        <h4>JB Podcast with Katumba</h4>
        <p>JB Podcast</p>
        <p>300 views</p>
      </div>
    </div>

    <div class="up-next-item" onclick="window.location='watch.html?v=VIDEO_ID_2'">
      <div class="up-next-thumb">
        <img src="https://i.ytimg.com/vi/dQw4w9WgXcQ/mqdefault.jpg" alt="">
        <span class="duration">8:12</span>
      </div>
      <div class="up-next-info">
        <h4>Next JB Podcast Episode</h4>
        <p>JB Podcast</p>
        <p>2.1K views</p>
      </div>
    </div>

    <div class="up-next-item" onclick="window.location='watch.html?v=VIDEO_ID_3'">
      <div class="up-next-thumb">
        <img src="https://i.ytimg.com/vi/9bZkp7q19f0/mqdefault.jpg" alt="">
        <span class="duration">15:30</span>
      </div>
      <div class="up-next-info">
        <h4>Behind The Scenes</h4>
        <p>JB Podcast</p>
        <p>1.5K views</p>
      </div>
    </div>
  </div>
</div>

<script>
  // VIDEO ID from your link: 3L47O1AwSZ8
  // START TIME: 31 seconds
  const videoId = "3L47O1AwSZ8";
  const startTime = 31;

  // Video database - edit this for each video
  const videos = {
    '3L47O1AwSZ8': {
      title: "JB Podcast Episode",
      views: "1.2K views • 2 weeks ago",
      channel: "JB Podcast",
      subs: "125K subscribers",
      desc: `Welcome to JB Podcast!
      
In this episode we dive deep into the conversation. 
Don't forget to Like, Comment and Subscribe!

Timestamps:
0:31 - Intro
2:15 - Main Topic

#JBPodcast #Podcast #Interview`
    }
  };

  // Fill in the data
  if(videos[videoId]) {
    document.getElementById('videoTitle').innerText = videos[videoId].title;
    document.getElementById('videoMeta').innerText = videos[videoId].views;
    document.getElementById('channelName').innerText = videos[videoId].channel;
    document.getElementById('subCount').innerText = videos[videoId].subs;
    document.getElementById('videoDesc').innerText = videos[videoId].desc;
  }

  // Load YouTube IFrame API - This fixes Error 153
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: {
        'playsinline': 1,
        'autoplay': 1,
        'mute': 1, // Browsers require mute for autoplay
        'controls': 1,
        'start': startTime, // Starts at 31s
        'rel': 0,
        'modestbranding': 1
      }
    });
  }
</script>

</body>
</html>
