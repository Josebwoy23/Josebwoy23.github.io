<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(180deg,#0f0c29,#302b63);color:#fff;padding-bottom:80px;min-height:100vh}
.tab{display:none;padding:12px}.active{display:block}
.nav{position:fixed;bottom:0;width:100%;display:flex;background:#fff}
.nav button{flex:1;padding:15px;border:none;background:none;font-weight:bold;color:#333}
.card{background:#fff;color:#222;padding:14px;margin:10px 0;border-radius:16px}
.btn{padding:14px;border:none;border-radius:25px;width:100%;font-weight:bold;margin:6px 0}
.btn-red{background:#ff0033;color:#fff}.btn-green{background:#00c853;color:#fff}.btn-yellow{background:#ffcc00;color:#000}
.admin-only{display:none!important}
.header{background:linear-gradient(90deg,#ff0066,#ffcc00);padding:18px;border-radius:0 0 20px 20px;margin:-12px -12px 15px -12px}
.chat-box{height:200px;overflow-y:auto;background:#f5f5f5;border-radius:12px;padding:8px}
.chat-msg{background:#fff;padding:6px 10px;border-radius:12px;margin:5px 0;color:#333;font-size:13px}
</style>
</head>
<body>

<div class="header"><h2 id="secretTap" style="margin:0">JB PLUS</h2></div>

<div id="radio" class="tab active">
<div class="card">
<h3>JB TRUE RADIO - NEW EASY MODE</h3>
<p id="rStat" style="font-size:13px;color:#666">Not connected</p>
<p style="font-size:12px;color:#888">Host ID is fixed: <b>jb-radio-host-2024</b></p>
<button class="btn btn-green" onclick="startListening()">Tap to Listen Live</button>
<div class="admin-only">
<hr>
<button class="btn btn-red" onclick="startBroadcast()">START BROADCAST (Admin)</button>
<button class="btn" onclick="stopBroadcast()" style="background:#333;color:#fff">Stop</button>
<p id="hostInfo" style="font-size:11px"></p>
</div>
</div>
<div class="card"><div id="chatBox" class="chat-box"></div><input id="chatIn" placeholder="Message" style="width:70%"><button onclick="sendLocalChat()" style="width:25%;padding:10px;border-radius:20px;border:none;background:#ff0066;color:#fff">Send</button></div>
</div>

<div id="live" class="tab">
<div class="card"><h3>JB LIVE TV</h3><button class="btn btn-yellow" onclick="window.open('https://store.pesapal.com/jbplussubscription','_blank')">PAY WITH PESAPAL</button><input id="transId" placeholder="Transaction ID" style="padding:12px;width:90%;border-radius:20px;border:1px solid #ddd"><button class="btn btn-green" onclick="unlockLive()">Unlock</button></div>
<div id="liveContent" style="display:none"><div class="card"><iframe width="100%" height="220" src="https://www.youtube-nocookie.com/embed/live_stream?channel=UCko2JV1XdHAV50BkPmu3bmg" allowfullscreen></iframe></div></div>
</div>

<div id="episodes" class="tab"><div id="videoList" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div></div>

<div id="upload" class="tab admin-only"><div class="card"><h3>Upload Admin</h3><input type="file" id="fileInput"><button class="btn btn-green" onclick="alert('Add Firebase config for upload')">Upload</button></div></div>

<div class="nav">
<button onclick="openTab('radio')">Radio</button><button onclick="openTab('live')">Live</button><button onclick="openTab('episodes')">Episodes</button><button class="admin-only" onclick="openTab('upload')">Upload</button>
</div>

<script>
const CHANNEL_ID="UCko2JV1XdHAV50BkPmu3bmg";
let peer, hostConn, isAdmin=localStorage.getItem('jb_is_admin')==='yes';
let tapCount=0,lastTap=0;

document.getElementById('secretTap').addEventListener('click',()=>{
 let now=Date.now(); if(now-lastTap>3000) tapCount=0; tapCount++; lastTap=now;
 if(tapCount>=5){ tapCount=0; let p=prompt('Password:'); if(p==='7788'){ isAdmin=true; localStorage.setItem('jb_is_admin','yes'); showAdmin(); alert('Admin ON'); }}
});
function showAdmin(){ let s=document.createElement('style'); s.innerHTML='.admin-only{display:block!important}'; document.head.appendChild(s); }
if(isAdmin) showAdmin();

function openTab(t){ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.getElementById(t).classList.add('active'); if(t==='episodes') loadVideos(); }

// ===== RADIO FIXED WITH PEERJS - WORKS 100% =====
function startBroadcast(){
  if(!isAdmin) return alert('Admin only');
  document.getElementById('rStat').innerText='Starting... Allow Mic';
  peer = new Peer('jb-radio-host-2024', { debug:1 });
  peer.on('open', id=>{
    document.getElementById('rStat').innerText='LIVE - ID: '+id+' - Talk now!';
    document.getElementById('hostInfo').innerText='You are LIVE. Listeners can hear you.';
  });
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    peer.on('call', call=>{
      call.answer(stream); // Send your voice to listener
    });
  }).catch(e=>alert('Mic denied: '+e.message));
}

function startListening(){
  document.getElementById('rStat').innerText='Connecting to host...';
  peer = new Peer(); // Random ID for listener
  peer.on('open', ()=>{
    let call = peer.call('jb-radio-host-2024'); // Call the host
    call.on('stream', remoteStream=>{
      let audio = new Audio();
      audio.srcObject = remoteStream;
      audio.play().then(()=>{ document.getElementById('rStat').innerText='LIVE - Listening - Volume Up!'; }).catch(e=>alert('Tap again to allow audio'));
    });
    call.on('error', e=>{ document.getElementById('rStat').innerText='Host Offline - Admin must Start Broadcast first'; });
  });
}

function stopBroadcast(){ if(peer){ peer.destroy(); document.getElementById('rStat').innerText='Stopped'; } }

function loadVideos(){
 fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id='+CHANNEL_ID))
.then(r=>r.json()).then(d=>{
   let h=''; d.items.forEach(v=>{ let vid=v.link.split('v=')[1]; h+=`<div style="background:#fff;border-radius:12px;overflow:hidden"><iframe width="100%" height="100" src="https://www.youtube-nocookie.com/embed/${vid}" allowfullscreen></iframe><p style="color:#333;font-size:10px;padding:4px;margin:0">${v.title.slice(0,30)}</p></div>`; });
   document.getElementById('videoList').innerHTML=h;
 });
}
function unlockLive(){ if(document.getElementById('transId').value.length>=4){ localStorage.setItem('jb_live_paid','yes'); document.getElementById('liveContent').style.display='block'; alert('Unlocked'); } }
function sendLocalChat(){ let m=document.getElementById('chatIn').value; if(!m) return; let d=document.createElement('div'); d.className='chat-msg'; d.innerText=m; document.getElementById('chatBox').appendChild(d); document.getElementById('chatIn').value=''; }

loadVideos();
</script>
</body>
 </html>
