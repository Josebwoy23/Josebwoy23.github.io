<style>
*{font-family:Poppins,sans-serif;box-sizing:border-box}body{margin:0;background:#050510;color:#fff;padding:0 12px 100px}

.btn{padding:12px;border:none;border-radius:12px;width:100%;font-weight:700;margin:6px 0;cursor:pointer}
.btn-pay{background:linear-gradient(90deg,#ff0066,#ff9900);color:#fff}
.admin{background:#1a1a3a;border:2px solid #ff0066;border-radius:14px;padding:12px;margin:10px}
.hidden-videos{display:none!important}
</style></head><body>
<div class="topbar"><b id="sTap">JB <span style="color:#8b5cf6">PLUS</span></b><span style="font-size:10px;color:#00e676">● Kampala Uganda</span></div>

<div class="video-card">
<div class="video-player">

<div class="block"></div>
<div id="badge" style="position:absolute;top:10px;left:10px;background:#00e676;color:#000;font-size:9px;padding:5px 12px;border-radius:20px;z-index:7">● MIX MODE</div>
<div id="nowPlaying" style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.8);color:#fff;font-size:9px;padding:5px 10px;border-radius:8px;z-index:7">🎵 African Hits 24/7</div>
<div id="lockOverlay" class="lock"><h3>🔒 Locked</h3><button class="btn btn-pay" onclick="window.open('https://store.pesapal.com/jbplussubscription','_blank')">PAY UGX 5000 TO UNLOCK LIVE</button><div style="display:flex;gap:6px;width:100%;margin-top:10px"><input id="tId" placeholder="Code"><button onclick="verify()" style="background:#fff;color:#000;padding:12px 18px;border:none;border-radius:10px;font-weight:800">OK</button></div></div>
</div>
<div style="padding:12px"><h4 id="vTitle" style="margin:0;font-size:13px">🎵 JB PLUS MUSIC TV</h4><p id="vMode" style="margin:2px 0;font-size:9px;color:#00e676">● AFRICAN HITS 24/7 - NEVER BORING</p></div>
<div id="adminMount"></div>
</div>

<div class="radio-card"><h3 style="margin:0;font-size:13px">● JB RADIO - JBLIVE</h3><p id="radioDebug" style="font-size:10px;color:#888;text-align:center;margin:8px 0">Radio Ready</p><button class="btn" style="background:#111;border:2px solid #00e676;color:#fff" onclick="startListening()" id="listenBtn">▶ LISTEN JB RADIO LIVE NOW</button><div id="radioAdminMount"></div></div>

<!-- THIS SECTION HIDDEN FROM USERS - ONLY ADMIN CAN SEE -->
<div id="moreSection" class="hidden-videos">
<h3 style="font-size:11px;margin:16px 0 8px;color:#ff0066">🎛 ADMIN ONLY - Playlist (Hidden from users)</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" id="moreVideos"></div>
</div>

<script>
const DB_URL="https://jb-live-default-rtdb.firebaseio.com";
const MY_CHANNEL_ID="UCko2JV1XdHAV50BkPmu3bmg";
const AGORA_APP_ID="c3ef1f48e3d4481f823652d818481c12";
const AGORA_TOKEN="007eJxTYLARnjWppEReS5XhjO/K2Qp8sveXKvpc1JQ+9HtJ6rIg50kKDMnGqWmGaSYWqcYpJiYWhmkWRsZmpkYpFoYWQF6yodH/57OyGgIZGTwX1rIyMkAgiM/G4OXk4xnmysAAAKsrHUw=";
const RADIO_CHANNEL="JBLIVE";
const _0xTEAM=["SkItVEVBTS1KQi1CT1NT","SkItVEVBTS1MQUlBTkEtMDE=","SkItVEVBTS1FUklDLTAy","SkItVEVBTS1NQVJZLTAz","SkItVEVBTS1UUkFDWS0wNA==","SkItVEVBTS1LRU5ULTA1","SkItVEVBTS1KT0FOLTA2","SkItVEVBTS1KT1NFLTA3","SkItVEVBTS1ST05BSC0wOA==","SkItVEVBTS1BTExFTi0wOQ==","Nzc4OA=="];
function _0xD(s){try{return atob(s)}catch(e){return""}}

// WORKING EMBEDDABLE ONLY - Removed blocked ones
const TRACE_MZIKI_PLAYLIST = [
  {id:"lTRiuFIWV54", title:"African Mix 2025 - 8 Hrs Nonstop"},
  {id:"jfKfPfyJRdk", title:"Amapiano Mix 2025 - SA Hits"},
  {id:"2x6CwsqUssI", title:"UGANDA NONSTOP MIX - Long"},
  {id:"s952nOxjMR0", title:"BEST UG MIX 2024 - Long"},
  {id:"Qocaa6X5X2Q", title:"AFROBEAT PARTY MIX"},
  {id:"ktvTqknDobU", title:"GOSPEL NONSTOP 3HRS"}
];

let agoraClient=null,localTrack=null,tap=0,lt=0,ytPlayer,currentIndex=parseInt(localStorage.getItem('jb_music_index')||'0'),isPaid=localStorage.getItem('jb_live_paid')==='yes';
let currentPlaylist=TRACE_MZIKI_PLAYLIST;

function getId(){let id=localStorage.getItem('jb_device_id');if(!id){id='jb-'+Date.now();localStorage.setItem('jb_device_id',id);}return id;}
async function countUser(c,r){try{await fetch(`${DB_URL}/users/${getId()}.json`,{method:'PUT',body:JSON.stringify({code:c,role:r,time:Date.now(),date:new Date().toLocaleDateString()})});}catch(e){}}
document.getElementById('sTap').addEventListener('click',()=>{let n=Date.now();if(n-lt>3000)tap=0;tap++;lt=n;if(tap>=5){tap=0;let p=prompt('Admin Key:');if(p&&_0xD("Nzc4OA==")===p.trim()){localStorage.setItem('jb_is_admin','yes');localStorage.setItem('jb_live_paid','yes');location.reload();}}});

function mountAdmin(){
 if(localStorage.getItem('jb_is_admin')!=='yes')return;
 // SHOW HIDDEN PLAYLIST ONLY FOR ADMIN
 document.getElementById('moreSection').classList.remove('hidden-videos');
 document.getElementById('adminMount').innerHTML=`<div class="admin"><p style="color:#ff0066;font-weight:800;font-size:11px;margin:0">🎛 ADMIN - JB - CLEAN MODE</p>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><div style="background:#0a0a14;padding:8px;border-radius:10px;text-align:center"><div id="totalC">0</div><div style="font-size:7px;color:#888">TOTAL</div></div><div style="background:#0a0a14;padding:8px;border-radius:10px;text-align:center"><div id="teamC">0</div><div style="font-size:7px">TEAM</div></div><div style="background:#0a0a14;padding:8px;border-radius:10px;text-align:center"><div id="fanC">0</div><div style="font-size:7px">FANS</div></div></div>
 <div style="margin-top:10px;border-top:1px solid #333;padding-top:8px">
 <p style="font-size:10px;color:#00e676">Users see ONLY main player - list hidden ✅</p>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><button onclick="nextVideo()" style="background:#111;border:1px solid #444;color:#fff;padding:10px;border-radius:8px;font-size:11px">⏭ NEXT MIX</button><button onclick="goLiveAuto()" style="background:#ff0066;color:#fff;border:none;padding:10px;border-radius:8px;font-size:11px;font-weight:700">🔴 GO LIVE AUTO</button></div>
 <button onclick="goPlaylistMode()" style="background:#222;color:#fff;border:1px solid #555;width:100%;padding:9px;border-radius:8px;margin-top:6px;font-size:10px">🎵 BACK TO MUSIC TV</button>
 </div><div id="userList" style="margin-top:8px;max-height:120px;overflow:auto;background:#0a0a14;border-radius:8px;padding:6px"></div></div>`;
 document.getElementById('radioAdminMount').innerHTML=`<button onclick="startBroadcast()" id="sBtn" style="width:100%;padding:14px;border-radius:12px;background:linear-gradient(90deg,#00c853,#00e676);color:#fff;border:none;font-weight:800;margin-top:10px">🟢 START RADIO STUDIO</button><button onclick="stopBroadcast()" id="eBtn" style="display:none;width:100%;padding:14px;border-radius:12px;background:#ff3b30;color:#fff;border:none;font-weight:800">🔴 STOP RADIO</button><p id="hostStat" style="font-size:10px;color:#00e676;text-align:center"></p>`;
 loadCounts(); listenPlayer(); loadGridAdmin();
}
async function loadCounts(){let ru=await fetch(`${DB_URL}/users.json`);let users=await ru.json()||{};let team=0,fans=0,h='',total=Object.keys(users).length;Object.values(users).reverse().slice(0,15).forEach(u=>{if((u.role||'').includes('team')||(u.role||'').includes('admin'))team++;else fans++;h+=`<div style="font-size:9px;border-bottom:1px solid #222;padding:4px;display:flex;justify-content:space-between"><b>${u.role}</b><span>${u.code}</span></div>`});try{document.getElementById('totalC').innerText=total;document.getElementById('teamC').innerText=team;document.getElementById('fanC').innerText=fans;document.getElementById('userList').innerHTML=h;}catch(e){}}
async function pushState(o){try{await fetch(`${DB_URL}/player.json`,{method:'PUT',body:JSON.stringify({...o,time:Date.now()})});}catch(e){}}
function listenPlayer(){setInterval(async()=>{try{let r=await fetch(`${DB_URL}/player.json`);let s=await r.json();if(!s||Date.now()-s.time>30000)return;if(s.mode==='live_auto'){showLiveAuto();}else if(s.videoId && ytPlayer && ytPlayer.getVideoData().video_id!==s.videoId){showPlaylistPlayer();ytPlayer.loadVideoById(s.videoId);updateNowPlaying(s.title);}}catch(e){}},4000);}
function showLiveAuto(){document.getElementById('ytPlayer').style.display='none';document.getElementById('liveFrameWrap').style.display='block';document.getElementById('liveFrameWrap').innerHTML=`<iframe width="100%" height="100%" src="https://www.youtube.com/embed/live_stream?channel=${MY_CHANNEL_ID}&autoplay=1&controls=0&modestbranding=1&rel=0" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;document.getElementById('vTitle').innerText='🔴 JB PLUS LIVE NOW';document.getElementById('vMode').innerText='🔴 LIVE AUTO';document.getElementById('badge').innerText='● LIVE NOW';document.getElementById('badge').style.background='#ff0066';}
function showPlaylistPlayer(){document.getElementById('liveFrameWrap').style.display='none';document.getElementById('ytPlayer').style.display='block';document.getElementById('badge').innerText='● TRACE MZIKI NONSTOP';document.getElementById('badge').style.background='#00e676';}
function updateNowPlaying(t){document.getElementById('nowPlaying').innerText='🎵 '+t;document.getElementById('vTitle').innerText=t.slice(0,35);}
window.nextVideo=async()=>{currentIndex=(currentIndex+1)%currentPlaylist.length;localStorage.setItem('jb_music_index',currentIndex);let v=currentPlaylist[currentIndex];showPlaylistPlayer();ytPlayer.loadVideoById(v.id);await pushState({videoId:v.id,title:v.title,mode:'playlist'});updateNowPlaying(v.title);}
window.goLiveAuto=async()=>{showLiveAuto();await pushState({mode:'live_auto',videoId:'LIVE_AUTO'});}
window.goPlaylistMode=async()=>{let v=currentPlaylist[currentIndex];showPlaylistPlayer();ytPlayer.loadVideoById(v.id);await pushState({videoId:v.id,title:v.title,mode:'playlist'});updateNowPlaying(v.title);}
async function verify(){let t=document.getElementById('tId').value.trim().toUpperCase();if(!t)return;for(let e of _0xTEAM){if(_0xD(e)===t){localStorage.setItem('jb_live_paid','yes');if(_0xD("Nzc4OA==")===t||_0xD("SkItVEVBTS1KQi1CT1NT")===t)localStorage.setItem('jb_is_admin','yes');await countUser(t,'team-'+t);location.reload();return;}}if(t.length>=5){localStorage.setItem('jb_live_paid','yes');await countUser(t,'fan');location.reload();return;}}
function checkLock(){if(isPaid){document.getElementById('lockOverlay').style.display='none';mountAdmin();}else document.getElementById('lockOverlay').style.display='flex'; if(localStorage.getItem('jb_is_admin')!=='yes'){document.getElementById('moreSection').style.display='none';}}checkLock();
function onYouTubeIframeAPIReady(){ytPlayer=new YT.Player('ytPlayer',{videoId:currentPlaylist[currentIndex].id,playerVars:{controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,showinfo:0,cc_load_policy:0,iv_load_policy:3,autoplay:1,playsinline:1},events:{onReady:()=>{updateNowPlaying(currentPlaylist[currentIndex].title);},onStateChange:(e)=>{if(e.data===0){nextVideo();}}}}); setInterval(()=>{if(document.getElementById('liveFrameWrap').style.display==='none'){nextVideo();}}, 20*60*1000);}
async function startBroadcast(){const d=document.getElementById('radioDebug');try{if(agoraClient){try{await agoraClient.leave();}catch(e){}}agoraClient=AgoraRTC.createClient({mode:"live",codec:"vp8"});agoraClient.setClientRole("host");await agoraClient.join(AGORA_APP_ID,RADIO_CHANNEL,AGORA_TOKEN,null);localTrack=await AgoraRTC.createMicrophoneAudioTrack();await agoraClient.publish([localTrack]);d.innerText='✅ LIVE ON AIR';document.getElementById('sBtn').style.display='none';document.getElementById('eBtn').style.display='block';document.getElementById('hostStat').innerText='● ON AIR';await fetch(`${DB_URL}/radioLive.json`,{method:'PUT',body:JSON.stringify({live:true})});}catch(err){d.innerText='❌ '+err.message;}}
async function stopBroadcast(){if(localTrack){localTrack.stop();localTrack.close();localTrack=null;}if(agoraClient){await agoraClient.leave();agoraClient=null;}document.getElementById('sBtn').style.display='block';document.getElementById('eBtn').style.display='none';document.getElementById('radioDebug').innerText='Stopped';await fetch(`${DB_URL}/radioLive.json`,{method:'PUT',body:JSON.stringify({live:false})});}
async function startListening(){const b=document.getElementById('listenBtn');const d=document.getElementById('radioDebug');b.innerText='CONNECTING...';try{if(agoraClient){try{await agoraClient.leave();}catch(e){}}agoraClient=AgoraRTC.createClient({mode:"live",codec:"vp8"});agoraClient.setClientRole("audience");agoraClient.on("user-published",async(u,m)=>{await agoraClient.subscribe(u,m);if(m==="audio"){u.audioTrack.play();d.innerText='🎧 PLAYING JBLIVE';b.innerText='🎧 LISTENING';}});await agoraClient.join(AGORA_APP_ID,RADIO_CHANNEL,AGORA_TOKEN,null);d.innerText='Connected - waiting host...';}catch(err){d.innerText=err.message;}}
function loadGridAdmin(){const c=document.getElementById('moreVideos');c.innerHTML=currentPlaylist.map(v=>`<div style="background:#11111f;border-radius:14px;overflow:hidden;border:1px solid #222;cursor:pointer" onclick="playThis('${v.id}','${v.title.replace(/'/g,'')}')"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" style="width:100%"><div style="padding:8px"><div style="font-size:10px">${v.title}</div></div></div>`).join('');}
window.playThis=async(id,title)=>{showPlaylistPlayer();currentIndex=currentPlaylist.findIndex(v=>v.id===id);localStorage.setItem('jb_music_index',currentIndex);ytPlayer.loadVideoById(id);await pushState({videoId:id,title:title,mode:'playlist'});updateNowPlaying(title);}
</script></body></html>
