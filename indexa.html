<style>
*{font-family:'Poppins',sans-serif;box-sizing:border-box}
body{margin:0;background:#0a0a14;color:#fff;padding:0 12px 90px 12px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 2px}
.video-card{background:#11111f;border:1px solid #2a2a40;border-radius:20px;overflow:hidden;margin:8px 0 16px 0}
.video-player{background:#000;aspect-ratio:16/9;position:relative;overflow:hidden}
.video-player iframe{position:absolute;top:-12%;left:-6%;width:112%;height:124%;border:none;pointer-events:none}
.video-player audio{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;background:#000}
.player-top{position:absolute;top:0;left:0;width:100%;padding:12px;display:flex;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);z-index:6;pointer-events:none}
.jb-watermark{position:absolute;bottom:14px;right:14px;background:rgba(139,92,246,.9);padding:5px 10px;border-radius:20px;font-size:9px;font-weight:800;z-index:7;pointer-events:none}
.lock-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.video-info{padding:12px;background:#1a1a2e;display:flex;justify-content:space-between}
.badge-live{background:#00c853;color:#fff;padding:4px 10px;border-radius:12px;font-size:10px}.badge-locked{background:#ff3b30;color:#fff;padding:4px 10px;border-radius:12px;font-size:10px}
.radio-card{background:#121222;border:2px solid #00e676;border-radius:20px;padding:16px;margin:16px 0}
.btn{padding:13px;border:none;border-radius:12px;width:100%;font-weight:700;margin:6px 0}.btn-pay{background:linear-gradient(90deg,#ff0066,#ff9900);color:#fff}
input{padding:13px;width:100%;border-radius:10px;border:2px solid #2a2a40;background:#0a0a14;color:#fff;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ep-card{background:#1a1a2e;border-radius:14px;overflow:hidden;border:1px solid #2a2a40}.ep-card img{width:100%;aspect-ratio:16/10;object-fit:cover}.ep-card p{font-size:11px;padding:8px;margin:0}
.admin-only{display:none!important}
.admin-panel{background:#1a1a3a;border:2px solid #ff0066;border-radius:12px;padding:12px;margin:10px}
</style>
</head>
<body>
<div class="topbar"><b id="secretTap">JB <span style="color:#8b5cf6">PLUS</span></b><span style="color:#00e676;font-size:11px">● Kampala Uganda</span></div>
<div class="video-card">
<div class="video-player"><div id="ytLive"></div><audio id="fillerAudio" controls autoplay style="display:none"></audio>
<div class="player-top"><span style="font-size:11px;font-weight:700">Streaming now</span><span id="feedLabel" style="font-size:9px;background:rgba(255,0,102,.9);padding:4px 8px;border-radius:12px">LIVE</span></div>
<div class="lock-overlay" id="lockOverlay"><div style="font-size:32px">🔒</div><h3>Live Locked Pay UGX 5000 PER MONTH</h3><button class="btn btn-pay" onclick="window.open('https://store.pesapal.com/jbplussubscription','_blank')">PAY PESAPAL -MTN/AIRTEL</button><div style="display:flex;gap:6px;width:100%;margin-top:10px"><input id="transId" placeholder=""><button onclick="verifyPayment()" style="background:#fff;color:#000;border:none;padding:13px 18px;border-radius:10px;font-weight:700">OK</button></div></div>
</div>
<div class="video-info"><h4 id="" style="margin:0;font-size:13px">JB PODCAST OFFICIAL APP</h4><span id="" class="badge-locked">IN STUDios</span></div>
<div class="admin-only"><div class="admin-panel"><p style="font-size:11px;color:#ff0066;font-weight:800;margin:0 0 8px 0">🎛 CONTROL</p><div style="display:flex;gap:6px"><button onclick="adminSet('my')">📡 MY LIVE</button><button onclick="adminSet('filler')">🎵 TRACE</button></div><p id="adminNote" style="font-size:9px;color:#00e5ff;margin-top:8px"></p></div></div>
</div>
<div class="radio-card">
<h3 style="margin:0">● JB RADIO - Channel: </h3>
<button class="btn" style="border:2px solid #00e676;background:#0a1a14;color:#fff;margin-top:12px" onclick="startListening()" id="listenBtn">▶ LISTEN JB RADIO LIVE NOW</button>
<p style="text-align:center;font-size:11px;color:#888;margin:6px 0" id="rStat">Channel JBLIVE ready</p>
<div class="admin-only"><button onclick="startBroadcast()" id="sBtn" style="width:100%;padding:12px;border-radius:10px;background:linear-gradient(90deg,#00c853,#00e676);color:#fff;border:none;font-weight:700">🟢 START RADIO STUDIO - JBLIVE</button><button onclick="stopBroadcast()" id="eBtn" style="display:none;width:100%;padding:12px;border-radius:10px;background:#ff3b30;color:#fff;border:none">🔴 STOP RADIO</button><p id="hostStat" style="font-size:10px;color:#00e676;text-align:center;margin-top:6px"></p></div>
</div>
<div class="grid" id="videoList"></div>
<script>
const MY_CHANNEL="UCko2JV1XdHAV50BkPmu3bmg";
const ADMIN_CODE="7788"; const USER_CODE="1010";
const AGORA_APP_ID="c3ef1f48e3d4481f823652d818481c12";
const AGORA_TOKEN="007eJxTYLARnjWppEReS5XhjO/K2Qp8sveXKvpc1JQ+9HtJ6rIg50kKDMnGqWmGaSYWqcYpJiYWhmkWRsZmpkYpFoYWQF6yodH/57OyGgIZGTwX1rIyMkAgiM/G4OXk4xnmysAAAKsrHUw=";
const RADIO_CHANNEL="JBLIVE";
const GALAXY_FM_URL="https://stream.zeno.fm/2t6prb0kba8uv";
const FILLER_LIST=["2x6CwsqUssI","s952nOxjMR0","jfKfPfyJRdk","AUDIO_GALAXY","lTRiuFIWV54"];
let fillerPos=parseInt(localStorage.getItem('jb_filler_pos')||'0');
let isPaid=localStorage.getItem('jb_live_paid')==='yes', isAdmin=localStorage.getItem('jb_is_admin')==='yes', tap=0,lt=0,ytPlayer;
let adminChoice=localStorage.getItem('jb_admin_feed')||'filler';
let agoraClient=null, localTrack=null;
document.getElementById('secretTap').addEventListener('click',()=>{let n=Date.now(); if(n-lt>3000)tap=0; tap++; lt=n; if(tap>=5){tap=0; let p=prompt('Admin Code:'); if(p===ADMIN_CODE){isAdmin=true; localStorage.setItem('jb_is_admin','yes'); location.reload();}}});
function showAdmin(){let s=document.createElement('style'); s.innerHTML='.admin-only{display:block!important}'; document.head.appendChild(s);}
if(isAdmin) showAdmin();
function verifyPayment(){let t=document.getElementById('transId').value.trim(); if(t===ADMIN_CODE){localStorage.setItem('jb_live_paid','yes'); localStorage.setItem('jb_is_admin','yes'); location.reload(); return;} if(t===USER_CODE || t.length>=4){localStorage.setItem('jb_live_paid','yes'); location.reload(); return;} alert('Invalid');}
function checkLock(){let o=document.getElementById('lockOverlay'); if(isPaid){o.style.display='none'; document.getElementById('liveBadge').innerText='● LIVE'; document.getElementById('liveBadge').className='badge-live'; document.getElementById('liveTitle').innerText='JB PLUS LIVE'; if(window.YT&&YT.Player) initYT();} else{o.style.display='flex';} loadVids();}
checkLock();
function initYT(){let item=FILLER_LIST[fillerPos%FILLER_LIST.length]; let isAudio=(item==="AUDIO_GALAXY"); let isLive=(adminChoice==='my'); let ytDiv=document.getElementById('ytLive'); let audioEl=document.getElementById('fillerAudio'); let label=document.getElementById('feedLabel'); if(ytPlayer){try{ytPlayer.destroy();}catch(e){}} clearTimeout(window.rotateTimer); if(isLive){ytDiv.style.display='block'; audioEl.style.display='none'; audioEl.pause(); ytPlayer=new YT.Player('ytLive',{height:'100%',width:'100%',playerVars:{autoplay:1,controls:0,modestbranding:1,rel:0,showinfo:0,iv_load_policy:3,fs:0,disablekb:1,playsinline:1},events:{onReady:e=>{e.target.loadVideoByUrl({mediaContentUrl:'https://www.youtube.com/embed/live_stream?channel='+MY_CHANNEL});}}});} else if(isAudio){ytDiv.style.display='none'; if(ytPlayer){try{ytPlayer.destroy();}catch(e){}} audioEl.style.display='block'; audioEl.src=GALAXY_FM_URL; audioEl.play().catch(()=>{});} else {ytDiv.style.display='block'; audioEl.style.display='none'; audioEl.pause(); ytPlayer=new YT.Player('ytLive',{height:'100%',width:'100%',videoId:item,playerVars:{autoplay:1,controls:0,modestbranding:1,rel:0,loop:1,playlist:item},events:{onReady:e=>{e.target.playVideo();}}}); window.rotateTimer=setTimeout(()=>{if(adminChoice==='filler'){fillerPos=(fillerPos+1)%FILLER_LIST.length; localStorage.setItem('jb_filler_pos',fillerPos); initYT();}}, 40*60*1000);}}
function adminSet(t){if(t==='my'){adminChoice='my';} else {if(adminChoice==='filler'){fillerPos=(fillerPos+1)%FILLER_LIST.length;} adminChoice='filler';} localStorage.setItem('jb_admin_feed',adminChoice); localStorage.setItem('jb_filler_pos',fillerPos); initYT();}
function onYouTubeIframeAPIReady(){if(isPaid) initYT();}
async function startBroadcast(){
 document.getElementById('hostStat').innerText='Joining JBLIVE...';
 document.getElementById('rStat').innerText='● Starting JBLIVE...';
 if(agoraClient){try{await agoraClient.leave();}catch(e){}}
 agoraClient = AgoraRTC.createClient({mode:"live", codec:"vp8"});
 agoraClient.setClientRole("host");
 try{
  await agoraClient.join(AGORA_APP_ID, RADIO_CHANNEL, AGORA_TOKEN, "host-"+Date.now());
  localTrack = await AgoraRTC.createMicrophoneAudioTrack();
  await agoraClient.publish([localTrack]);
  document.getElementById('rStat').innerText='● LIVE ON JBLIVE CHANNEL 🎙️';
  document.getElementById('hostStat').innerText='✅ LIVE on JBLIVE - Talk now';
  document.getElementById('sBtn').style.display='none'; document.getElementById('eBtn').style.display='block';
 }catch(e){document.getElementById('hostStat').innerText='Error: '+e.message; console.log(e);}
}
async function stopBroadcast(){if(localTrack){localTrack.stop(); localTrack.close();} if(agoraClient){await agoraClient.leave();} document.getElementById('sBtn').style.display='block'; document.getElementById('eBtn').style.display='none'; document.getElementById('hostStat').innerText='Stopped';}
async function startListening(){
 document.getElementById('rStat').innerText='● Joining JBLIVE...'; document.getElementById('listenBtn').innerText='⏳ CONNECTING...';
 if(agoraClient){try{await agoraClient.leave();}catch(e){}}
 agoraClient = AgoraRTC.createClient({mode:"live", codec:"vp8"});
 agoraClient.setClientRole("audience");
 agoraClient.on("user-published", async (user, mediaType)=>{ await agoraClient.subscribe(user, mediaType); if(mediaType==="audio"){user.audioTrack.play(); document.getElementById('rStat').innerText='● LISTENING JBLIVE 🎧'; document.getElementById('listenBtn').innerText='🔊 LIVE ON JBLIVE';}});
 try{ await agoraClient.join(AGORA_APP_ID, RADIO_CHANNEL, AGORA_TOKEN, "listener-"+Date.now()); document.getElementById('rStat').innerText='● Connected to JBLIVE - Waiting for host...'; setTimeout(()=>{if(document.getElementById('rStat').innerText.includes('Waiting')){document.getElementById('rStat').innerText='● Host offline - Start studio'; document.getElementById('listenBtn').innerText='▶ TRY AGAIN';}},8000);}catch(e){document.getElementById('rStat').innerText='Token error: '+e.message;}
}
async function loadVids(){try{let r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id='+MY_CHANNEL)); let d=await r.json(); if(!d.items)return; let h=''; d.items.forEach((v,i)=>{let id=v.link.split('v=')[1]; let th='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'; let t=v.title.slice(0,32); let lock=!isPaid&&i>=2; h+=lock?`<div class="ep-card"><img src="${th}"><p>🔒 ${t}</p></div>`:`<div class="ep-card" onclick="playEp('${id}')"><img src="${th}"><p>▶ ${t}</p></div>`;}); document.getElementById('videoList').innerHTML=h;}catch(e){}}
function playEp(id){if(!isPaid)return; if(ytPlayer) ytPlayer.loadVideoById(id);}
</script>
</body>
