<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JBStudentHub Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #3a003a;
      margin: 0;
      padding: 0;
    }
    header {
      background: #3a003a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    form {
      background: purple;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 30px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .store-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .item {
      background: purple;
      border: 1px solid #ccc;
      padding: 15px;
      width: 240px;
      border-radius: 5px;
      color: white;
      text-align: center;
    }
    .item img {max-width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
    }
    .item button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 8px 12px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="store-container" id="storeItems">
    <!-- New items will appear here -->
  </div>
</div>

<script>
  const form = document.getElementById('itemForm');
  const store = document.getElementById('storeItems');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const title = document.getElementById('title').value;
    const price = document.getElementById('price').value;
    const image = document.getElementById('image').value;
    const desc = document.getElementById('desc').value;

    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <img src="image" alt="{title}">
      <h3>title</h3>
      <p><strong>UGX{price}</strong></p>
      <p>${desc}</p>
      <button>Buy Now</button>
    `;
    
    store.prepend(item);
    form.reset();
  });
</script>

</body>
</html>
